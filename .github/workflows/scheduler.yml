# Background task scheduler.
#
# Vercel's Hobby plan only allows daily cron jobs, so this workflow calls the
# application's task endpoint every 5 minutes instead. The endpoint runs due
# recurring tasks (scheduled publishing, reminders, digests, retention) and
# processes queued background tasks (notifications, file processing...).
#
# Requires the repository secret CRON_SECRET (same value as the CRON_SECRET
# environment variable on Vercel). Until it is set, the job is skipped.
# Optional repository variable APP_URL overrides the default production URL.
name: Background task scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: task-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ vars.APP_URL || 'https://venkat-sai-global.vercel.app' }}
    steps:
      - name: Skip when CRON_SECRET is not configured
        if: env.CRON_SECRET == ''
        run: echo "CRON_SECRET repository secret is not set; skipping."

      - name: Run due background tasks
        if: env.CRON_SECRET != ''
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --max-time 90 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/v1/cron/tick")
          echo "HTTP ${status}"
          head -c 2000 response.json || true
          if [ "${status}" -ge 400 ]; then exit 1; fi
